# GitHub Pages for the CAPIE documentation (capie-mods/capie).
# In the monorepo this file lives at plugin/capie/ci/docs-pages.yml; the repository split renames it
# to .github/workflows/docs-pages.yml in capie-mods/capie.
#
# Cost: the repository is public, so Actions minutes are free. The job runs only when the site
# or its build inputs change, or by hand. The shared theme, the Zensical override script and the
# Paradox lexer live in capie-mods/capie-design (sites/shared), so that repository is checked out
# next to this one.

name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "sites/capie/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: capie-mods/capie-design
          path: _design
          sparse-checkout: sites/shared
      - run: cp -r _design/sites/shared sites/shared
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync python sites/shared/zensical_overrides.py
      - run: uv run --no-sync zensical build -f sites/capie/zensical.toml --clean --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/capie/site
      - id: deployment
        uses: actions/deploy-pages@v5
